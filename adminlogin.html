<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Login | PASAR UMKM</title>
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
    <link rel="shortcut icon" href="favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="PASAR UMKM AI" />
    <link rel="manifest" href="favicon/site.webmanifest" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Auth Helper -->
    <script src="auth-google.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Outfit', 'sans-serif'],
                        body: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --primary: #1E293B;
            --accent: #3B82F6;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0F172A;
            color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
            padding: 1rem;
        }

        /* Background Animation */
        .bg-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            z-index: -1;
            filter: blur(60px);
            animation: pulse 10s infinite alternate;
        }

        @keyframes pulse {
            0% {
                transform: translate(-10%, -10%) scale(1);
            }
            100% {
                transform: translate(10%, 10%) scale(1.2);
            }
        }

        .login-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 10;
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            color: white;
            padding: 13px 18px 13px 44px;
            width: 100%;
            transition: all 0.25s ease;
            outline: none;
            font-size: 13px;
        }

        .glass-input:focus {
            border-color: #3B82F6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
            background: rgba(15, 23, 42, 0.85);
        }

        .btn-admin {
            background: linear-gradient(135deg, #3B82F6, #2563EB);
            color: white;
            font-weight: 700;
            padding: 13px;
            border-radius: 14px;
            width: 100%;
            transition: all 0.25s ease;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-admin:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(37, 99, 235, 0.5);
            background: linear-gradient(135deg, #60A5FA, #2563EB);
        }

        .btn-admin:active {
            transform: scale(0.98);
        }

        /* Toast */
        #toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
        }

        .toast {
            background: #1E293B;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 12px 20px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            animation: slideIn 0.3s ease forwards;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>
    <div id="toast-container"></div>

    <div class="login-card">
        <!-- Logo & Header -->
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-blue-600/20 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-blue-500/30 shadow-lg shadow-blue-500/10">
                <i class="fa-solid fa-shield-halved text-3xl text-blue-500"></i>
            </div>
            <h1 class="font-display text-2xl font-black mb-1 tracking-tight">Admin Portal</h1>
            <p class="text-slate-400 text-xs font-medium">Verifikasi & Pengelolaan Sistem PASAR UMKM</p>
        </div>

        <!-- Form Login Khusus Admin -->
        <form id="admin-login-form" onsubmit="handleAdminLogin(event)" class="space-y-4">
            <!-- Email -->
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1.5 uppercase tracking-wider">Email Admin</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                    <input type="email" id="admin-email" class="glass-input" placeholder="arifanadmin@gmail.com" required autocomplete="username">
                </div>
            </div>

            <!-- Password -->
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1.5 uppercase tracking-wider">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                    <input type="password" id="admin-password" class="glass-input pr-11" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors p-1" title="Tampilkan/Sembunyikan password">
                        <i id="eye-icon" class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="btn-login" class="btn-admin flex items-center justify-center gap-2 mt-2">
                <i class="fa-solid fa-right-to-bracket"></i> Masuk sebagai Admin
            </button>
        </form>

        <!-- Divider -->
        <div class="flex items-center my-6">
            <div class="flex-grow border-t border-slate-700"></div>
            <span class="flex-shrink mx-3 text-slate-500 text-[11px] uppercase tracking-wider font-semibold">Atau</span>
            <div class="flex-grow border-t border-slate-700"></div>
        </div>

        <!-- Google OAuth Option (Khusus arifanadmin@gmail.com) -->
        <button id="admin-google-btn" onclick="handleAdminGoogleSignIn()" class="w-full py-2.5 px-4 bg-slate-800/80 hover:bg-slate-800 text-slate-200 border border-slate-700 rounded-xl text-xs font-bold flex items-center justify-center gap-2.5 transition-all">
            <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
            </svg>
            Masuk dengan Google (arifanadmin@gmail.com)
        </button>

        <p class="mt-6 text-center text-[10px] text-slate-500 font-medium tracking-widest uppercase">
            &copy; 2025 PASAR UMKM &bull; Akses Terbatas Admin
        </p>

        <div class="mt-3 text-center">
            <a href="index.html" class="text-[11px] text-blue-400/70 font-semibold hover:text-blue-400 transition-colors">
                &larr; Kembali ke Beranda
            </a>
        </div>
    </div>

    <script>
        // ================================================================
        // KREDENSIAL RESMI ADMIN
        // ================================================================
        const VALID_ADMIN_EMAIL = 'arifanadmin@gmail.com';
        const VALID_ADMIN_PASS  = 'arifan2754';

        // Cek sesi admin yang sudah aktif
        window.addEventListener('load', () => {
            const user = PasarAuth.getCurrentUser();
            if (user && user.email && user.email.toLowerCase() === VALID_ADMIN_EMAIL.toLowerCase()) {
                window.location.href = 'adminverifikasi.html';
            }
        });

        // Toggle lihat password
        function togglePasswordVisibility() {
            const passInput = document.getElementById('admin-password');
            const eyeIcon = document.getElementById('eye-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Login Manual dengan Email & Password
        function handleAdminLogin(event) {
            event.preventDefault();
            const email = document.getElementById('admin-email').value.trim();
            const pass  = document.getElementById('admin-password').value;
            const btn   = document.getElementById('btn-login');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Memverifikasi...';

            setTimeout(() => {
                if (email.toLowerCase() === VALID_ADMIN_EMAIL.toLowerCase() && pass === VALID_ADMIN_PASS) {
                    const adminUser = {
                        uid: 'admin_arifan',
                        email: VALID_ADMIN_EMAIL,
                        name: 'Admin Arifan',
                        displayName: 'Admin Arifan',
                        role: 'admin',
                        photoURL: 'https://ui-avatars.com/api/?name=Arifan+Admin&background=3B82F6&color=fff'
                    };
                    localStorage.setItem('pasar_umkm_user', JSON.stringify(adminUser));
                    localStorage.setItem('pasar_umkm_token', 'admin_token_' + Date.now());
                    localStorage.setItem('pasar_umkm_role', 'admin');

                    showToast('Login Berhasil! Mengalihkan ke Admin Portal...', 'success');
                    setTimeout(() => {
                        window.location.href = 'adminverifikasi.html';
                    }, 600);
                } else {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk sebagai Admin';
                    showToast('Email atau Password salah! Akses ditolak.', 'error');
                }
            }, 400);
        }

        // Login dengan Akun Google (Hanya arifanadmin@gmail.com)
        function handleAdminGoogleSignIn() {
            const btn = document.getElementById('admin-google-btn');
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menghubungkan Google...'; }

            PasarAuth.signInWithGoogle(
                ({ user }) => {
                    if (user.email.toLowerCase() !== VALID_ADMIN_EMAIL.toLowerCase()) {
                        PasarAuth.signOut();
                        showToast('Akses Ditolak! Hanya arifanadmin@gmail.com yang diizinkan.', 'error');
                        if (btn) {
                            btn.disabled = false;
                            btn.innerHTML = 'Masuk dengan Google (arifanadmin@gmail.com)';
                        }
                        return;
                    }
                    // Admin terverifikasi via Google
                    const u = PasarAuth.getCurrentUser();
                    if (u) {
                        u.role = 'admin';
                        localStorage.setItem('pasar_umkm_user', JSON.stringify(u));
                        localStorage.setItem('pasar_umkm_role', 'admin');
                    }
                    showToast('Berhasil! Masuk ke sistem admin...', 'success');
                    setTimeout(() => window.location.href = 'adminverifikasi.html', 800);
                },
                (err) => {
                    console.error('Admin Google Sign-In Error:', err);
                    showToast('Login Google dibatalkan atau gagal.', 'error');
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = 'Masuk dengan Google (arifanadmin@gmail.com)';
                    }
                },
                'admin'
            );
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            let icon = 'fa-circle-info text-blue-400';
            if (type === 'success') icon = 'fa-circle-check text-emerald-400';
            if (type === 'error')   icon = 'fa-circle-xmark text-red-400';
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>

</html>
